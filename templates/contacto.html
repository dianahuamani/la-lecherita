{% extends 'base.html' %}

{% block content %}

<section class="p-10 text-center mt-6">

    <h2 class="text-3xl text-green-700 mb-6">Contacto</h2>

    <form class="flex flex-col gap-4 max-w-xl mx-auto bg-white p-6 rounded shadow">

        <input type="text" placeholder="Nombre completo" class="p-2 border rounded">
        <input type="text" placeholder="Apellido completo" class="p-2 border rounded">
        <input type="text" placeholder="Telefono" class="p-2 border rounded">
        <input type="email" placeholder="Correo" class="p-2 border rounded">
        <textarea placeholder="Mensaje" class="p-2 border rounded"></textarea>

        <!-- CTA -->
        <button class="bg-green-700 text-white p-2 rounded hover:bg-green-800 transition">
            Quiero información
        </button>

    </form>

</section>

{% endblock %}
