<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Asociación Lecherita</title>

    <!-- Tailwind (OBLIGATORIO para tus clases) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>

<body class="bg-gray-100">

<!-- NAVBAR -->
<header class="fixed w-full bg-green-700 text-white shadow z-50">
    <nav class="flex justify-between items-center max-w-5xl mx-auto p-4">

        <h1 class="font-bold text-lg md:text-xl">
            Asociación Lecherita
        </h1>

        <!-- Botón hamburguesa -->
        <button id="menuBtn" class="md:hidden text-2xl">☰</button>

        <!-- Menú escritorio -->
        <ul class="hidden md:flex gap-8">
            <li><a href="/" class="hover:text-yellow-300">Inicio</a></li>
            <li><a href="/nosotros" class="hover:text-yellow-300">Nosotros</a></li>
            <li><a href="/producto" class="hover:text-yellow-300">Producto</a></li>
            <li><a href="/elegirnos" class="hover:text-yellow-300">¿Por qué elegirnos?</a></li>
            <li><a href="/galeria" class="hover:text-yellow-300">Galería</a></li>
            <li><a href="/contacto" class="hover:text-yellow-300">Contacto</a></li>
        </ul>

    </nav>

    <!-- Menú móvil -->
    <div id="mobileMenu" class="hidden flex-col bg-green-800 text-center md:hidden">
        <a href="/" class="p-3 border-b">Inicio</a>
        <a href="/nosotros" class="p-3 border-b">Nosotros</a>
        <a href="/producto" class="p-3 border-b">Producto</a>
        <a href="/elegirnos" class="p-3 border-b">¿Por qué elegirnos?</a>
        <a href="/galeria" class="p-3 border-b">Galería</a>
        <a href="/contacto" class="p-3">Contacto</a>
    </div>
</header>

<!-- CONTENIDO -->
<main class="pt-28 md:pt-32">
    {% block content %}{% endblock %}
</main>

<!-- JS externo -->
<script src="{{ url_for('static', filename='js/main.js') }}"></script>

</body>
</html>
